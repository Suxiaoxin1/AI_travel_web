<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/>
    </marker>
    <marker id="arr-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#059669"/>
    </marker>
    <marker id="arr-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#d97706"/>
    </marker>
    <style>
      text { font-family: 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif; }
    </style>
  </defs>

  <!-- light background -->
  <rect width="100%" height="100%" fill="#f8fafc"/>
  <rect x="0" y="0" width="1200" height="96" fill="#eef2ff"/>

  <text x="40" y="42" fill="#111827" font-size="22" font-weight="700">VOLO 旅途小电影：是怎么做出来的？</text>
  <text x="40" y="70" fill="#4b5563" font-size="13">把照片变成带旁白的短视频（前端只负责填表单和等待；真正算力在右边视频服务）</text>

  <!-- left panel -->
  <rect x="28" y="118" width="360" height="560" rx="18" fill="#ffffff" stroke="#c7d2fe" stroke-width="2"/>
  <text x="48" y="148" fill="#4338ca" font-size="14" font-weight="700">你看到的页面（前端）</text>

  
  <rect x="50" y="168" width="316" height="78" rx="14" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.5"/>
  <text x="208" y="196" fill="#1f2937" font-size="14" font-weight="700" text-anchor="middle">1. 打开「FILM / VOLO 相册」</text>
  <text x="208" y="218" fill="#4b5563" font-size="11" text-anchor="middle">TravelJournal 页面</text>

  <line x1="208" y1="246" x2="208" y2="268" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>
  
  <rect x="50" y="268" width="316" height="92" rx="14" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.5"/>
  <text x="208" y="296" fill="#1f2937" font-size="14" font-weight="700" text-anchor="middle">2. 上传 3～8 张照片，填地点、心得、参数</text>
  <text x="208" y="318" fill="#4b5563" font-size="11" text-anchor="middle">可以先点「AI 生成旁白」写台词</text>

  <line x1="208" y1="360" x2="208" y2="382" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>
  
  <rect x="50" y="382" width="316" height="92" rx="14" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.5"/>
  <text x="208" y="410" fill="#1f2937" font-size="14" font-weight="700" text-anchor="middle">3. 点「开始合成旅途小电影」</text>
  <text x="208" y="432" fill="#4b5563" font-size="11" text-anchor="middle">右侧出现：等待中 → 成功 / 失败</text>

  <line x1="208" y1="474" x2="208" y2="496" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>
  
  <rect x="50" y="496" width="316" height="78" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="208" y="524" fill="#1f2937" font-size="14" font-weight="700" text-anchor="middle">4. 播放或下载 MP4</text>
  <text x="208" y="546" fill="#4b5563" font-size="11" text-anchor="middle">success 状态下可播放</text>


  <text x="50" y="620" fill="#6b7280" font-size="11">对应代码：VoloFilmWorkspace.vue</text>
  <text x="50" y="640" fill="#6b7280" font-size="11">请求逻辑：filmCompose.js</text>

  <!-- right panel -->
  <rect x="420" y="118" width="752" height="560" rx="18" fill="#ffffff" stroke="#bbf7d0" stroke-width="2"/>
  <text x="440" y="148" fill="#047857" font-size="14" font-weight="700">背后的视频服务（默认端口 3000）</text>

  <!-- A B -->
  
  <rect x="448" y="168" width="300" height="86" rx="14" fill="#ecfdf5" stroke="#86efac" stroke-width="1.5"/>
  <text x="598" y="196" fill="#1f2937" font-size="14" font-weight="700" text-anchor="middle">A. 收到照片</text>
  <text x="598" y="218" fill="#4b5563" font-size="11" text-anchor="middle">POST /api/upload</text>

  
  <rect x="800" y="168" width="340" height="86" rx="14" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="970" y="196" fill="#1f2937" font-size="14" font-weight="700" text-anchor="middle">B. （可选）看图写台词</text>
  <text x="970" y="218" fill="#4b5563" font-size="11" text-anchor="middle">POST /api/analyze</text>
  <text x="970" y="234" fill="#4b5563" font-size="11" text-anchor="middle">只生成文字，不是说话</text>


  <!-- dashed optional from left form to B -->
  <path d="M 366 330 C 420 330, 760 250, 800 220" fill="none" stroke="#d97706" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#arr-orange)"/>
  <text x="620" y="270" fill="#b45309" font-size="11" font-weight="600">可选：先写台词</text>

  <!-- main from left to A/C -->
  <path d="M 366 430 C 400 430, 420 210, 448 210" fill="none" stroke="#059669" stroke-width="1.8" marker-end="url(#arr-green)"/>
  <text x="390" y="390" fill="#047857" font-size="11" font-weight="600">① 上传</text>

  <line x1="598" y1="254" x2="598" y2="288" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- C -->
  
  <rect x="448" y="288" width="692" height="78" rx="14" fill="#ecfdf5" stroke="#86efac" stroke-width="1.5"/>
  <text x="794" y="316" fill="#1f2937" font-size="14" font-weight="700" text-anchor="middle">C. 接单：开始做片</text>
  <text x="794" y="338" fill="#4b5563" font-size="11" text-anchor="middle">POST /api/video-engine/tasks</text>
  <text x="794" y="354" fill="#4b5563" font-size="11" text-anchor="middle">带上：照片路径 + 台词 + 音色</text>

  <path d="M 366 450 C 410 470, 430 330, 448 330" fill="none" stroke="#059669" stroke-width="1.8" marker-end="url(#arr-green)"/>
  <text x="390" y="470" fill="#047857" font-size="11" font-weight="600">② 开始做片</text>

  <line x1="794" y1="366" x2="794" y2="398" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- D TTS highlighted -->
  <rect x="448" y="398" width="220" height="100" rx="14" fill="#fff1f2" stroke="#fb7185" stroke-width="2"/>
  <text x="558" y="428" fill="#9f1239" font-size="14" font-weight="700" text-anchor="middle">D. 语音合成 TTS</text>
  <text x="558" y="452" fill="#be123c" font-size="11" text-anchor="middle">把台词变成人声</text>
  <text x="558" y="468" fill="#be123c" font-size="11" text-anchor="middle">女声 Aoede / 男声 Fenrir</text>

  <!-- E -->
  <rect x="688" y="398" width="220" height="100" rx="14" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.8"/>
  <text x="798" y="428" fill="#5b21b6" font-size="14" font-weight="700" text-anchor="middle">E. 照片变动画</text>
  <text x="798" y="452" fill="#6d28d9" font-size="11" text-anchor="middle">百炼 wan2.7</text>
  <text x="798" y="468" fill="#6d28d9" font-size="11" text-anchor="middle">每张照生一段动画</text>

  <!-- F -->
  <rect x="928" y="398" width="212" height="100" rx="14" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.8"/>
  <text x="1034" y="428" fill="#5b21b6" font-size="14" font-weight="700" text-anchor="middle">F. 剪辑合成</text>
  <text x="1034" y="452" fill="#6d28d9" font-size="11" text-anchor="middle">FFmpeg</text>
  <text x="1034" y="468" fill="#6d28d9" font-size="11" text-anchor="middle">把动画片段 + 人声合成一条视频</text>

  <line x1="668" y1="448" x2="688" y2="448" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="908" y1="448" x2="928" y2="448" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>

  <line x1="794" y1="498" x2="794" y2="530" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- G -->
  
  <rect x="448" y="530" width="692" height="86" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="794" y="558" fill="#1f2937" font-size="14" font-weight="700" text-anchor="middle">G. 存成成片文件</text>
  <text x="794" y="580" fill="#4b5563" font-size="11" text-anchor="middle">/uploads/*.mp4</text>
  <text x="794" y="596" fill="#4b5563" font-size="11" text-anchor="middle">前端每 3 秒问一次：做好了没？</text>


  <!-- poll back -->
  <path d="M 448 575 C 390 575, 380 530, 366 530" fill="none" stroke="#2563eb" stroke-width="1.7" marker-end="url(#arr)"/>
  <text x="390" y="556" fill="#1d4ed8" font-size="11" font-weight="600">③ 轮询进度</text>

  <!-- tips box -->
  <rect x="28" y="700" width="1144" height="150" rx="16" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="52" y="736" fill="#111827" font-size="15" font-weight="700">重要区分</text>
  <text x="52" y="768" fill="#374151" font-size="13">「AI 生成旁白」= 写台词文字（analyze）</text>
  <text x="52" y="796" fill="#9f1239" font-size="13" font-weight="600">「语音合成 TTS」= 把台词读成声音（在成片任务里面，不是单独前端接口）</text>
  <text x="52" y="824" fill="#374151" font-size="13">关掉「生成旁白」开关时：跳过 D，做无声动态成片</text>

  <text x="52" y="870" fill="#9ca3af" font-size="11">主站 API :8081 不参与成片。重启视频服务会丢进度。源码：src/utils/filmCompose.js</text>
</svg>
