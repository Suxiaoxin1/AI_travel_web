<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFEDE0"/>
      <stop offset="45%" stop-color="#FFF4EA"/>
      <stop offset="100%" stop-color="#FFE4D4"/>
    </linearGradient>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1.4" fill="#E85A3C" fill-opacity="0.14"/>
      <circle cx="20" cy="16" r="1.1" fill="#3BA89A" fill-opacity="0.12"/>
      <circle cx="12" cy="24" r="1.2" fill="#E8A838" fill-opacity="0.12"/>
    </pattern>
  </defs>
  <rect width="900" height="1200" fill="url(#base)"/>
  <rect width="900" height="1200" fill="url(#dots)"/>
  <!-- washi only at outer corners, keep center clear for photos -->
  <g opacity="0.5">
    <rect x="-30" y="40" width="200" height="22" fill="#F2A4B8" transform="rotate(-10 70 51)" rx="2"/>
    <rect x="700" y="1120" width="240" height="22" fill="#7BC4B0" transform="rotate(7 820 1131)" rx="2"/>
  </g>
  <g>
    <circle cx="120" cy="70" r="6" fill="#E85A3C" fill-opacity="0.35"/>
    <circle cx="800" cy="90" r="7" fill="#3BA89A" fill-opacity="0.3"/>
    <circle cx="80" cy="1120" r="6" fill="#E8A838" fill-opacity="0.35"/>
    <circle cx="840" cy="1080" r="7" fill="#F2A4B8" fill-opacity="0.3"/>
  </g>
  <rect x="22" y="22" width="856" height="1156" fill="none" stroke="#E85A3C" stroke-opacity="0.22" stroke-width="2" stroke-dasharray="10 8" rx="18"/>
</svg>
