server {
    listen 80;
    server_name _;
    client_max_body_size 12m;

    root /usr/share/nginx/html;
    index index.html;

    # AI 视觉/生图/视频可能超过 2 分钟，单独放宽超时
    location /api/ai/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # VOLO / odyssee：浏览器同源访问上传、轮询、成片文件
    # /film-api/api/upload → film:3000/api/upload
    location /film-api/ {
        proxy_pass http://film:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 80m;
        proxy_connect_timeout 30s;
        proxy_send_timeout 1800s;
        proxy_read_timeout 1800s;
    }

    location /uploads/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 导出/画布读图同源，允许跨域读取（同源时浏览器不走 CORS；外域调试时有用）
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, OPTIONS";
        add_header Cross-Origin-Resource-Policy cross-origin;
    }

    location = /health {
        proxy_pass http://backend:8000/health;
    }

    # SPA 路由 /journal 与静态目录 public/journal/ 冲突：目录命中会 403。
    # 精确路径走前端；子路径继续提供贴纸/渲染器静态资源。
    location = /journal {
        try_files /index.html =404;
    }
    location = /journal/ {
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
