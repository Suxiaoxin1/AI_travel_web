# Starwalk HTTPS reverse proxy for the public IP certificate.
# This configuration initially uses a Let's Encrypt staging certificate.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name 111.230.144.219;

    ssl_certificate /etc/letsencrypt/live/111.230.144.219/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/111.230.144.219/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 12m;
    add_header Permissions-Policy "microphone=(self)" always;

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
