# Starwalk public-IP ACME validation vhost.
# Keep this vhost for ACME renewal after HTTPS is enabled.
server {
    listen 80;
    listen [::]:80;
    server_name 111.230.144.219;

    access_log /var/log/nginx/starwalk-ip-acme.access.log;
    error_log /var/log/nginx/starwalk-ip-acme.error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/starwalk-ip-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
